# The dashboard of the Discord bot in Grafana (cf. server-setup.md of dov118/infra, Grafana): one for both
# environments, its list "Environnement" reading the bases in MariaDB. Applied by
# deploy/init/03-env.sh (kubectl apply -k), in monitoring: prod and preprod lay the same object.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: grafana-dashboard-eso-status-bot
    files: [eso-status-bot.json=dashboard.json]
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: eso-status}
