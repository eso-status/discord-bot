# The namespace and the CD's account (cd-rbac.yaml) stay out: 03-env.sh applies them on their own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- deployment.yaml
images:
- name: eso_status_discord_bot
