# Recreate: two bots on one token would announce everything twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eso-status-bot-deploy
  namespace: eso-status-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eso-status-bot-deploy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: eso-status-bot-deploy
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - env:
        - name: DB_DEBUG
          value: 'false'
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: eso-status-bot-database-creds
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              key: DB_NAME
              name: eso-status-bot-database-creds
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: eso-status-bot-database-creds
        - name: DB_PORT
          value: '3306'
        - name: DB_TYPE
          value: mysql
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: eso-status-bot-database-creds
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              key: DISCORD_TOKEN
              name: eso-status-bot-app-creds
        - name: POD_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: metadata.uid
        - name: POD_IP
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: status.podIP
        image: eso_status_discord_bot
        imagePullPolicy: IfNotPresent
        name: eso-status-discord-bot
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            memory: 4Gi
          requests:
            # The peak of 7 days divided by 0.7 (14.7m and 210.5 Mi measured on 14/11): at its
            # peak, the container stays under 70 % of its reservation.
            cpu: 21m
            memory: 301Mi
      imagePullSecrets:
      - name: eso-status-bot-harbor-creds
