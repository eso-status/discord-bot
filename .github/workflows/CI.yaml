name: CI

on:
  push:
    branches:
      - '*'
      - 'feature/*'
      - 'hotfix/*'
      - 'bugfix/*'
      - 'release/*'

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6.0.2

      - name: Install npm
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.14.0

      - name: Install npm dependencies
        run: npm ci

      - name: Create env file
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_TESTING_GUILDID: ${{ secrets.DISCORD_TESTING_GUILDID }}
          DISCORD_TESTING_CHANNELID: ${{ secrets.DISCORD_TESTING_CHANNELID }}
        run: |
          cat .env.example > .env
          sed -i -e "s/__DB_TYPE__/sqlite/g" ./.env
          sed -i -e "s/__DB_HOST__//g" ./.env
          sed -i -e "s/__DB_PORT__//g" ./.env
          sed -i -e "s#__DB_NAME__#src/database/dev#g" ./.env
          sed -i -e "s/__DB_USER__//g" ./.env
          sed -i -e "s/__DB_PASSWORD__//g" ./.env
          sed -i -e "s/__DB_DEBUG__//g" ./.env
          sed -i -e "s/__DISCORD_TOKEN__/$DISCORD_TOKEN/g" ./.env
          sed -i -e "s/__DISCORD_TESTING_GUILDID__/$DISCORD_TESTING_GUILDID/g" ./.env
          sed -i -e "s/__DISCORD_TESTING_CHANNELID__/$DISCORD_TESTING_CHANNELID/g" ./.env

      - name: Build assets
        run: npm run build

      - name: Run linter
        run: npm run lint

      - name: Run database migration
        run: npm run migration:run

      - name: Run test
        run: npm run test:cov

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@a31c9398be7ace6bbfaf30c0bd5d415f843d45e9 # 7.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
