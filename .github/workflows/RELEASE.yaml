name: RELEASE

on:
  pull_request:
    types: [closed]
    branches:
      - "main"

jobs:
  release:
    name: RELEASE
    # 24.04 rather than latest: it carries skopeo (runner-images readme), latest moves to 26.04.
    runs-on: ubuntu-24.04
    if: contains(github.head_ref, 'release/')
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4.0.3
        with:
          node-version: 20.17.0

      - name: Get version
        id: get_version
        run: |
          VERSION=`node -p "require('./package.json').version"`
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup de kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # 4.0.1
        with:
          version: 'v1.35.10'

      - name: Setup de la configuration de K3s
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > /tmp/kubeconfig.yaml

      # deploy/ is applied whole by kustomize (the runner ships it), at the released version; a value
      # still to fix stops it first.
      - name: Apply deploy/ at the released version
        env:
          IMAGE: ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_REPOSITORY }}:${{ steps.get_version.outputs.version }}
        run: |
          if grep -rn '<valeur de' deploy/; then exit 1; fi
          (cd deploy/prod && kustomize edit set image "eso_status_discord_bot=${IMAGE}")
          kubectl --kubeconfig=/tmp/kubeconfig.yaml apply -k deploy/prod/
          kubectl --kubeconfig=/tmp/kubeconfig.yaml rollout status deployment/eso-status-bot-deploy -n eso-status-bot --timeout=5m

      - name: Login to Harbor
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # 4.8.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Harbor keeps whatever an environment runs: its rule « retain always » on deployed-* holds
      # this image whatever the releases pushed after it (server-setup.md of dov118/infra). The
      # same digest gets the tag, read with the credentials of the Harbor login of this job.
      - name: Mark the image as deployed
        env:
          IMAGE: ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_REPOSITORY }}:${{ steps.get_version.outputs.version }}
        run: skopeo copy --all --preserve-digests "docker://${IMAGE}" "docker://${IMAGE%:*}:deployed-prod"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.CUSTOM_TOKEN }}
        run: |
          gh release create ${{ steps.get_version.outputs.version }} --title "${{ steps.get_version.outputs.version }}" --generate-notes --latest
