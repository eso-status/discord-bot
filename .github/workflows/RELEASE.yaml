name: RELEASE

on:
  pull_request:
    types: [closed]
    branches:
      - 'preprod'

jobs:
  release:
    name: RELEASE
    # 24.04 rather than latest: it carries skopeo (runner-images readme), latest moves to 26.04.
    runs-on: ubuntu-24.04
    if: contains(github.head_ref, 'release/')
    timeout-minutes: 30
    steps:
      - name: Récupération du code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: 24.14.0

      - name: Get version
        id: get_version
        run: |
          VERSION=`node -p "require('./package.json').version"`
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup de kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # 4.0.1
        with:
          version: 'v1.35.10'

      - name: Setup de la configuration de K3s
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_V3 }}
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > /tmp/kubeconfig.yaml

      # deploy/ is applied whole by kustomize (the runner ships it), at the released version; a value
      # still to fix stops it first.
      - name: Apply deploy/ at the released version
        env:
          IMAGE: ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_REPOSITORY }}:${{ steps.get_version.outputs.version }}
        run: |
          if grep -rn '<valeur de' deploy/; then exit 1; fi
          (cd deploy/preprod && kustomize edit set image "eso_status_discord_bot=${IMAGE}")
          kubectl --kubeconfig=/tmp/kubeconfig.yaml apply -k deploy/preprod/
          kubectl --kubeconfig=/tmp/kubeconfig.yaml rollout status deployment/eso-status-bot-preprod-deploy -n eso-status-bot-preprod --timeout=5m

      - name: Login to Harbor
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # 4.8.0
        with:
          registry: ${{ secrets.HARBOR_URL }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # Harbor keeps whatever an environment runs: its rule « retain always » on deployed-* holds
      # this image whatever the releases pushed after it (server-setup.md of dov118/infra). The
      # same digest gets the tag, read with the credentials of the Harbor login of this job.
      - name: Mark the image as deployed
        env:
          IMAGE: ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/${{ secrets.HARBOR_REPOSITORY }}:${{ steps.get_version.outputs.version }}
        run: skopeo copy --all --preserve-digests "docker://${IMAGE}" "docker://${IMAGE%:*}:deployed-preprod"

      - name: Notify Discord - Déploiement réussi
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          HARBOR_URL: ${{ secrets.HARBOR_URL }}
          HARBOR_PROJECT: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_REPOSITORY: ${{ secrets.HARBOR_REPOSITORY }}
          KUBE_NAMESPACE_V3: eso-status-bot-preprod
          VERSION: ${{ steps.get_version.outputs.version }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"GitHub Action\",
              \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
              \"embeds\": [{
                \"title\": \"✅ Déploiement réussi\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Projet\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"Déployé par\", \"value\": \"$ACTOR\", \"inline\": true},
                  {\"name\": \"Image\", \"value\": \"$HARBOR_URL/$HARBOR_PROJECT/$HARBOR_REPOSITORY:$VERSION\", \"inline\": false},
                  {\"name\": \"Namespace\", \"value\": \"$KUBE_NAMESPACE_V3\", \"inline\": true}
                ],
                \"url\": \"$SERVER_URL/$REPO/actions/runs/$RUN_ID\"
              }]
            }"

      - name: Notify Discord - Déploiement échoué
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          KUBE_DEPLOYMENT_V3: eso-status-bot-preprod-deploy
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"GitHub Action\",
              \"avatar_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
              \"embeds\": [{
                \"title\": \"❌ Déploiement échoué\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"Projet\", \"value\": \"$REPO\", \"inline\": true},
                  {\"name\": \"Déclenché par\", \"value\": \"$ACTOR\", \"inline\": true},
                  {\"name\": \"Deployment\", \"value\": \"$KUBE_DEPLOYMENT_V3\", \"inline\": true},
                  {\"name\": \"Logs\", \"value\": \"$SERVER_URL/$REPO/actions/runs/$RUN_ID\", \"inline\": false}
                ]
              }]
            }"

